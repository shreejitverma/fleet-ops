# Deployed copy: this file is the source for .github/workflows/fleet-sync.yml
# in the private shreejitverma/fleet-ops repo (server-side sync layer).
# The per-fork rollout was rejected by design: a workflow commit on a fork's
# default branch permanently diverges it from upstream, breaking ff-only sync.
# One central repo loops all forks instead; forks stay pristine mirrors.
#
# Requires the FLEET_SYNC_TOKEN Actions secret: a fine-grained PAT with
# Contents read-write AND Workflows read-write on every sync:true repo,
# including repos added after the token was created. github.token only
# reaches this host repo. A contents-only token gets HTTP 422 from
# merge-upstream when the commits touch .github/workflows, and a token whose
# repository list omits a fork gets HTTP 404 even when the branches match.
# repos.txt mirrors the manifest's sync: true list.
# The loop lives in bin/fleet-sync-remote.sh so a failure is printed and does
# not abort the rest of the list. The inline `bash -e` body used to exit
# inside `out=$(gh repo sync ...)` before that line was logged.
name: fleet-sync
on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast-forward every fork's default branch from upstream
        env:
          GH_TOKEN: ${{ secrets.FLEET_SYNC_TOKEN }}
        run: bash bin/fleet-sync-remote.sh
