# Fleet manifest - single source of truth for fleet scripts.
# Generated 2026-08-11 from empirical discovery (gh repo view + on-disk scan).
# Workspace root: ~/github (confirmed). Control dir: ~/github/.fleet.
#
# Conventions:
#   install: verbatim command run from the repo root; "none" = nothing to install.
#   provides_bin: executables expected on PATH after install (empirically verified).
#   install_mechanism: how the bin reaches PATH today (kind: plugin: how the agents load it).
#   sync: include in daily upstream sync (ff-only policy; diverged forks are logged, never merged).

- name: lavish-axi
  owner: shreejitverma
  is_fork: true
  upstream: kunchenguid/lavish-axi
  default_branch: main
  path: ~/github/lavish-axi
  kind: cli
  toolchain: [node@>=22, pnpm@11.5.2]
  install: "pnpm install --frozen-lockfile && pnpm run build"
  install_mechanism: "npm-link: /opt/homebrew/lib/node_modules/lavish-axi -> repo; build is live immediately"
  provides_bin: [lavish-axi]
  aliases: {jump: cdlav, run: lav}
  sync: true
  notes: "HTML artifact editor CLI. Ships Claude skill (skills/lavish) and plugin.json. Already in sync-forks."

- name: firstmate
  owner: shreejitverma
  is_fork: true
  upstream: kunchenguid/firstmate
  default_branch: main
  path: ~/github/firstmate
  kind: config
  toolchain: [bash]
  install: "none"
  install_mechanism: "clone is the distro: AGENTS.md + skills + bin/fm-* helper scripts invoked in-repo by agent harnesses; nothing goes on PATH"
  provides_bin: []
  aliases: {jump: cdfm}
  sync: false
  notes: "Agent-crew orchestration distro (tmux/worktree based). Provides the stow skill via ic-link. sync: false is deliberate since 2026-09-19: this fork carries fork-specific commits (first: shreejitverma/firstmate#1, bootstrap accepts the gemini dispatch harness without the typed key) and the owner does not open PRs on the parent, so it can never fast-forward and ff-only sync would misreport it as diverged daily. Take parent updates through a deliberate sync-upstream merge PR on the fork via no-mistakes, then run /updatefirstmate in the running home."

- name: no-mistakes
  owner: shreejitverma
  is_fork: true
  upstream: kunchenguid/no-mistakes
  default_branch: main
  path: ~/github/no-mistakes
  kind: cli
  toolchain: [go]
  install: "make build && install -d $HOME/go/bin && install -m 755 bin/no-mistakes $HOME/go/bin/no-mistakes"
  install_mechanism: "build + install to go/bin WITHOUT the daemon restart that upstream's make install does: the daemon rightly refuses to stop while a pipeline run is active, which failed the 2026-08-12 13:55 sync after the binary had installed fine. KeepAlive restarts the daemon onto the new binary naturally. A refreshed copy sits in ~/.local/bin until the go/bin PATH entry lands via rebuild; retire it after."
  provides_bin: [no-mistakes]
  aliases: {jump: cdnm, run: nm}
  sync: true
  notes: "Ship gate pipeline (review/tests/lint/push/PR/CI). Has its own LaunchAgent daemon (com.kunchenguid.no-mistakes.daemon). Ships Claude skill. Already in sync-forks."

